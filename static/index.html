<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <title>Mapa Ambiental — Campinas</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Fragment+Mono&display=swap" rel="stylesheet">

    <style>
        :root {
            --paper: #EDEFE8;
            --paper-2: #E3E7DC;
            --ink: #14251B;
            --muted: #5A6B5F;
            --creek: #0F5E6B;
            --signal: #D9480F;
            --hairline: #C9D0C2;
            --shadow: 0 12px 32px rgba(16, 35, 26, .16);

            --font-display: "Bricolage Grotesque", system-ui, sans-serif;
            --font-body: "Archivo", system-ui, sans-serif;
            --font-mono: "Fragment Mono", ui-monospace, monospace;
        }

        * { box-sizing: border-box; }

        body { margin: 0; font-family: var(--font-body); color: var(--ink); }
        #map { height: 100vh; }

        :focus-visible { outline: 2px solid var(--creek); outline-offset: 2px; }

        /* ---------- Chrome esquerdo: ficha + camadas ---------- */
        .chrome-left {
            position: absolute;
            top: 14px;
            left: 14px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: min(340px, calc(100vw - 28px));
            max-height: calc(100vh - 28px);
        }

        .brand {
            background: var(--paper);
            border: 1px solid var(--hairline);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 14px 16px;
        }

        .brand-row { display: flex; align-items: center; gap: 10px; }

        .brand-mark { flex: none; }

        .brand-eyebrow {
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: .16em;
            text-transform: uppercase;
            color: var(--muted);
            margin: 0 0 6px;
        }

        .brand-title {
            font-family: var(--font-display);
            font-weight: 800;
            font-size: clamp(1.5rem, 3.6vw, 2rem);
            line-height: 1.02;
            letter-spacing: -0.01em;
            margin: 0;
        }

        .brand-meta {
            font-family: var(--font-mono);
            font-size: 10.5px;
            color: var(--muted);
            margin: 10px 0 0;
        }

        /* ---------- Ficha de camadas (a legenda) ---------- */
        .sheet {
            display: flex;
            flex-direction: column;
            min-height: 0;
            background: var(--paper);
            border: 1px solid var(--hairline);
            border-radius: 12px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .banner {
            display: none;
            background: var(--signal);
            color: #FFF;
            font-size: 12px;
            line-height: 1.45;
            padding: 9px 14px;
        }
        .banner strong { font-weight: 600; }

        .sheet-head { padding: 12px 14px 10px; border-bottom: 1px solid var(--hairline); }

        .sheet-title {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 15px;
            margin: 0;
        }

        .sheet-hint {
            font-size: 12px;
            color: var(--muted);
            margin: 3px 0 0;
        }

        .layer-list { overflow-y: auto; padding: 4px 6px 6px; }

        .sheet-foot { padding: 8px 14px 10px; border-top: 1px solid var(--hairline); }
        .sheet-tip { font-size: 12px; color: var(--muted); margin: 0; }

        /* ---------- Linha de camada ---------- */
        .layer-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 8px;
            border-radius: 8px;
        }
        .layer-row:hover { background: var(--paper-2); }

        .layer-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0;
            cursor: pointer;
            position: relative;
        }

        .layer-check {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .layer-symbol { flex: none; transition: opacity .18s ease; }
        .layer-row[data-on="false"] .layer-symbol { opacity: .32; }

        .layer-toggle:has(.layer-check:focus-visible) .layer-symbol {
            outline: 2px solid var(--creek);
            outline-offset: 2px;
            border-radius: 3px;
        }

        .layer-name {
            font-weight: 600;
            font-size: 13.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color .18s ease;
        }
        .layer-row[data-on="false"] .layer-name { color: var(--muted); }

        .layer-kind {
            font-family: var(--font-mono);
            font-size: 9.5px;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--muted);
            flex: none;
        }
        .layer-row[data-on="false"] .layer-kind { display: none; }

        .layer-status {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--muted);
            width: 56px;
            flex: none;
        }
        .layer-status.is-error { color: var(--signal); font-weight: 700; }

        .layer-opacity {
            -webkit-appearance: none;
            appearance: none;
            width: 48px;
            height: 14px;
            background: transparent;
            cursor: pointer;
            flex: none;
        }
        .layer-opacity::-webkit-slider-runnable-track {
            height: 3px;
            border-radius: 2px;
            background: var(--hairline);
        }
        .layer-opacity::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: var(--ink);
            border: 2px solid var(--paper);
            margin-top: -4px;
        }
        .layer-opacity::-moz-range-track {
            height: 3px;
            border-radius: 2px;
            background: var(--hairline);
        }
        .layer-opacity::-moz-range-thumb {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--ink);
            border: 2px solid var(--paper);
        }

        /* ---------- Mapa base + zoom ---------- */
        .basemap {
            background: var(--paper);
            border: 1px solid var(--hairline);
            border-radius: 9px;
            box-shadow: var(--shadow);
            display: flex;
            overflow: hidden;
        }
        .basemap-btn {
            font-family: var(--font-body);
            font-weight: 600;
            font-size: 12px;
            color: var(--muted);
            background: transparent;
            border: 0;
            padding: 6px 12px;
            cursor: pointer;
        }
        .basemap-btn.is-active { color: var(--ink); background: var(--paper-2); }
        .basemap-btn:hover { color: var(--ink); }

        .leaflet-control-zoom {
            border: 1px solid var(--hairline) !important;
            border-radius: 9px !important;
            box-shadow: var(--shadow) !important;
            overflow: hidden;
        }
        .leaflet-control-zoom a {
            background: var(--paper) !important;
            color: var(--ink) !important;
            border: 0 !important;
            font-family: var(--font-mono);
        }
        .leaflet-control-zoom a:hover { background: var(--paper-2) !important; }

        .leaflet-control-attribution {
            background: var(--paper) !important;
            color: var(--muted) !important;
            font-family: var(--font-mono) !important;
            font-size: 9px !important;
        }
        .leaflet-control-attribution a { color: var(--creek) !important; }

        /* ---------- Popup: ficha de dados ---------- */
        .leaflet-popup-content-wrapper {
            background: var(--paper);
            color: var(--ink);
            border: 1px solid var(--hairline);
            border-radius: 10px;
            box-shadow: var(--shadow);
        }
        .leaflet-popup-content { margin: 12px 14px; }
        .leaflet-popup-tip { background: var(--paper); border: 1px solid var(--hairline); }

        .ficha { min-width: 190px; max-width: 260px; }
        .ficha-eyebrow {
            font-family: var(--font-mono);
            font-size: 9.5px;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--muted);
            margin: 0 0 4px;
        }
        .ficha-coords {
            font-family: var(--font-mono);
            font-size: 11.5px;
            line-height: 1.5;
            margin: 0 0 8px;
        }
        .ficha-entry { border-top: 1px solid var(--hairline); padding: 8px 0 2px; }
        .ficha-layer {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 13px;
            margin: 0 0 4px;
        }
        .ficha-symbol { flex: none; width: 28px; }
        .ficha-attrs { margin: 0; display: grid; gap: 2px; }
        .ficha-attrs > div { display: flex; justify-content: space-between; gap: 10px; }
        .ficha-attrs dt {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--muted);
        }
        .ficha-attrs dd {
            margin: 0;
            font-size: 12px;
            font-weight: 500;
            text-align: right;
            overflow-wrap: anywhere;
        }
        .ficha-empty {
            border-top: 1px solid var(--hairline);
            margin: 8px 0 0;
            padding-top: 8px;
            font-style: italic;
            font-size: 12px;
            color: var(--muted);
        }

        /* ---------- Instrumento ---------- */
        .readout {
            position: absolute;
            bottom: 14px;
            left: 14px;
            z-index: 900;
            display: flex;
            align-items: baseline;
            gap: 16px;
            padding: 7px 12px;
            background: var(--paper);
            border: 1px solid var(--hairline);
            border-radius: 9px;
            box-shadow: var(--shadow);
            font-family: var(--font-mono);
            font-size: 11.5px;
        }
        .readout-item b {
            font-weight: 600;
            color: var(--muted);
            margin-right: 5px;
        }

        /* ---------- Entrada ---------- */
        @media (prefers-reduced-motion: no-preference) {
            .chrome-left, .readout, .basemap, .leaflet-control-zoom {
                animation: rise .5s cubic-bezier(.2, .7, .2, 1) backwards;
            }
            .readout { animation-delay: .15s; }
            .basemap, .leaflet-control-zoom { animation-delay: .1s; }
            .layer-row { animation: rise .45s cubic-bezier(.2, .7, .2, 1) backwards; }
            .layer-row:nth-child(1) { animation-delay: .08s; }
            .layer-row:nth-child(2) { animation-delay: .12s; }
            .layer-row:nth-child(3) { animation-delay: .16s; }
            .layer-row:nth-child(4) { animation-delay: .20s; }
            .layer-row:nth-child(5) { animation-delay: .24s; }
            .layer-row:nth-child(6) { animation-delay: .28s; }
            .layer-row:nth-child(7) { animation-delay: .32s; }
            .layer-row:nth-child(8) { animation-delay: .36s; }
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: none; }
        }

        /* ---------- Mobile ---------- */
        @media (max-width: 640px) {
            .chrome-left {
                position: fixed;
                inset: 0;
                padding: 10px;
                width: auto;
                max-height: none;
                pointer-events: none;
                justify-content: space-between;
            }
            .brand, .sheet { pointer-events: auto; width: 100%; }
            .brand { max-width: calc(100% - 116px); padding: 12px 14px; }
            .brand-eyebrow { font-size: 9px; }
            .brand-title { font-size: 1.25rem; }
            .brand-meta { display: none; }
            .sheet { max-height: 44vh; border-radius: 14px; }
            .readout { display: none; }
            .layer-status { width: 46px; }
            .layer-opacity { width: 40px; }
        }
    </style>
</head>
<body>

<div id="map"></div>

<div class="chrome-left">
    <header class="brand">
        <p class="brand-eyebrow">Campinas · SP · Dados ambientais</p>
        <div class="brand-row">
            <svg class="brand-mark" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
                <circle cx="12" cy="12" r="6.5" fill="none" stroke="#0F5E6B" stroke-width="1.6"/>
                <path d="M12 1v5M12 18v5M1 12h5M18 12h5" stroke="#0F5E6B" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            <h1 class="brand-title">Mapa Ambiental</h1>
        </div>
        <p class="brand-meta" id="brand-meta"></p>
    </header>

    <section class="sheet" aria-label="Camadas">
        <div id="banner" class="banner" role="alert">
            <strong>Serviço temporariamente indisponível.</strong> Confira a configuração do Google Earth Engine e recarregue a página.
        </div>
        <header class="sheet-head">
            <h2 class="sheet-title">Camadas</h2>
            <p class="sheet-hint">Ative uma camada para vê-la no mapa.</p>
        </header>
        <div id="layer-controls" class="layer-list"></div>
        <footer class="sheet-foot">
            <p class="sheet-tip">Clique no mapa para inspecionar um ponto.</p>
        </footer>
    </section>
</div>

<div class="readout" aria-hidden="true">
    <span class="readout-item"><b>LAT</b><span id="rd-lat">-22.900000</span></span>
    <span class="readout-item"><b>LON</b><span id="rd-lon">-47.060000</span></span>
    <span class="readout-item"><b>ZOOM</b><span id="rd-zoom">11</span></span>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
const map = L.map('map').setView([-22.9, -47.06], 11);

// ---------------------------
// BASEMAPS (Mapa / Satélite)
// ---------------------------
const basemaps = {
    "OSM": L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'),
    "Satelite": L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}')
};
const activeBase = {layer: basemaps["OSM"]};
activeBase.layer.addTo(map);

const BaseControl = L.Control.extend({
    options: {position: 'topright'},
    onAdd() {
        const div = L.DomUtil.create('div', 'basemap');
        const labels = {OSM: 'Mapa', Satelite: 'Satélite'};
        div.innerHTML = Object.keys(basemaps).map(k =>
            `<button type="button" class="basemap-btn${k === 'OSM' ? ' is-active' : ''}" data-base="${k}">${labels[k]}</button>`
        ).join('');
        div.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
                if (activeBase.key === btn.dataset.base) return;
                map.removeLayer(activeBase.layer);
                activeBase.key = btn.dataset.base;
                activeBase.layer = basemaps[btn.dataset.base];
                activeBase.layer.addTo(map);
                div.querySelectorAll('button').forEach(b => b.classList.toggle('is-active', b === btn));
            });
        });
        L.DomEvent.disableClickPropagation(div);
        L.DomEvent.disableScrollPropagation(div);
        return div;
    }
});
activeBase.key = 'OSM';
new BaseControl().addTo(map);

// ---------------------------
// CAMADAS
// ---------------------------
const layersConfig = {
    "Limite": {asset: "projects/ee-rogergodoytest/assets/limite_municipal", color: "000000", kind: "polígono"},
    "APA": {asset: "projects/ee-pigee/assets/UnidadesConservacaoCampinas", color: "3AF40B", kind: "polígono"},
    "APP": {asset: "projects/ee-pigee/assets/areaPreservacaoPermanente", color: "f1fc07", kind: "polígono"},
    "Amortecimento": {asset: "projects/ee-pigee/assets/zonasAmortecimento", color: "f50618", kind: "polígono"},
    "Nascentes": {asset: "projects/ee-pigee/assets/nascentes_campinas", color: "13f2f9", kind: "ponto", point: true},
    "Hidrografia": {asset: "projects/ee-pigee/assets/hidrografia_campinas", color: "031fbb", kind: "linha"},
    "HIDS": {asset: "projects/ee-pigee/assets/hids", color: "fa9e09", kind: "polígono"},
    "PIDS": {asset: "projects/ee-pigee/assets/hids_pids", color: "d488de", kind: "polígono"}
};

const TILE_TTL_MS = 20 * 3600 * 1000;      // URLs do GEE expiram em ~1 dia
const REFRESH_COOLDOWN_MS = 5 * 60 * 1000; // evita loop de recarga em falha
const DEFAULT_LAYERS = ["Limite", "Hidrografia"];

const tileCache = {};    // tileCacheKey -> {url, fetchedAt}
const layerState = {};   // name -> {promise, layer}
const lastRefresh = {};  // name -> timestamp
const controls = {};     // name -> {checkbox, status, opacity, row}

document.getElementById('brand-meta').textContent =
    `${Object.keys(layersConfig).length} camadas · Google Earth Engine · WGS84`;

// ---------------------------
// SÍMBOLOS CARTOGRÁFICOS (a legenda)
// ---------------------------
function symbol(name, color) {
    const c = '#' + color;
    const dash = (x1, y1, x2, y2, sw, da) =>
        `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${sw}"${da ? ` stroke-dasharray="${da}"` : ''} stroke-linecap="round"/>`;
    switch (name) {
        case 'Limite':
            return `<svg viewBox="0 0 28 16" width="28" height="16" aria-hidden="true">${dash(2, 8, 26, 8, 2.5, '5 3.5')}</svg>`;
        case 'APA':
            return `<svg viewBox="0 0 28 16" width="28" height="16" aria-hidden="true"><rect x="2" y="2.5" width="24" height="11" rx="2" fill="${c}" opacity=".5"/><circle cx="8" cy="8" r="1.6" fill="${c}"/><circle cx="14" cy="8" r="1.6" fill="${c}"/><circle cx="20" cy="8" r="1.6" fill="${c}"/></svg>`;
        case 'APP':
            return `<svg viewBox="0 0 28 16" width="28" height="16" aria-hidden="true"><rect x="2" y="2.5" width="24" height="11" rx="2" fill="${c}" opacity=".6"/><path d="M3 3 L25 13" stroke="#7A7E2E" stroke-width="1.4" stroke-dasharray="3 2.5"/></svg>`;
        case 'Amortecimento':
            return `<svg viewBox="0 0 28 16" width="28" height="16" aria-hidden="true"><path d="M3 3 L25 13 M6 3 L28 13 M1 7 L21 13" stroke="${c}" stroke-width="1.6" opacity=".8"/></svg>`;
        case 'Nascentes':
            return `<svg viewBox="0 0 28 16" width="28" height="16" aria-hidden="true"><circle cx="9" cy="8" r="3" fill="${c}" stroke="#0F3A3D" stroke-width="1.4"/><circle cx="20" cy="8" r="2" fill="${c}" stroke="#0F3A3D" stroke-width="1.4"/></svg>`;
        case 'Hidrografia':
            return `<svg viewBox="0 0 28 16" width="28" height="16" aria-hidden="true"><path d="M2 12 Q7 3 12 9 T22 6" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round"/></svg>`;
        case 'HIDS':
            return `<svg viewBox="0 0 28 16" width="28" height="16" aria-hidden="true"><rect x="3" y="2.5" width="22" height="11" rx="2" fill="none" stroke="${c}" stroke-width="2"/><path d="M9 8 H19 M14 4 V12" stroke="${c}" stroke-width="1.6"/></svg>`;
        case 'PIDS':
            return `<svg viewBox="0 0 28 16" width="28" height="16" aria-hidden="true"><rect x="3" y="2.5" width="22" height="11" rx="2" fill="none" stroke="${c}" stroke-width="1.6" stroke-dasharray="3.5 2.5"/><circle cx="14" cy="8" r="2" fill="${c}"/></svg>`;
        default:
            return `<svg viewBox="0 0 28 16" width="28" height="16" aria-hidden="true"><rect x="2" y="2.5" width="24" height="11" rx="2" fill="${c}"/></svg>`;
    }
}

// ---------------------------
// HELPERS
// ---------------------------
function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
}

function formatValue(v) {
    if (v === null || v === undefined) return '';
    if (typeof v === 'object') return JSON.stringify(v);
    return v;
}

function tileCacheKey(config) {
    return `${config.asset}_${config.color}_${config.point}`;
}

// ---------------------------
// CARGA LAZY + RECARGA QUANDO EXPIRA
// ---------------------------
function fetchTileUrl(config) {
    const key = tileCacheKey(config);
    const cached = tileCache[key];
    if (cached && Date.now() - cached.fetchedAt < TILE_TTL_MS) {
        return Promise.resolve(cached.url);
    }

    const qs = new URLSearchParams({
        asset_id: config.asset,
        palette: config.color,
        is_point: String(config.point === true),
    });

    return fetch(`/tile?${qs}`).then(async res => {
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.url) {
            const err = new Error(data.detail || `HTTP ${res.status}`);
            err.status = res.status;
            throw err;
        }
        tileCache[key] = {url: data.url, fetchedAt: Date.now()};
        return data.url;
    });
}

function makeTileLayer(url, name, config) {
    const layer = L.tileLayer(url);
    layer.on('tileerror', () => refreshLayer(name, config));
    return layer;
}

function loadLayer(name, config) {
    const st = layerState[name];
    if (st && st.promise) return st.promise;

    const promise = fetchTileUrl(config)
        .then(url => {
            const layer = makeTileLayer(url, name, config);
            layerState[name] = {promise, layer};
            return layer;
        })
        .catch(err => {
            delete layerState[name];
            throw err;
        });

    layerState[name] = {promise, layer: null};
    return promise;
}

function refreshLayer(name, config) {
    const st = layerState[name];
    if (!st || !st.layer) return;

    const now = Date.now();
    if (now - (lastRefresh[name] || 0) < REFRESH_COOLDOWN_MS) return;
    lastRefresh[name] = now;

    delete tileCache[tileCacheKey(config)];
    const old = st.layer;

    fetchTileUrl(config)
        .then(url => {
            const fresh = makeTileLayer(url, name, config);
            fresh.setOpacity(old.options.opacity || 1);
            if (map.hasLayer(old)) {
                map.removeLayer(old);
                fresh.addTo(map);
            }
            layerState[name].layer = fresh;
        })
        .catch(() => {});
}

// ---------------------------
// UI DE CAMADAS
// ---------------------------
const container = document.getElementById("layer-controls");

async function enableLayer(name, config, ctrl) {
    const {checkbox, status, opacity, row} = ctrl;
    if (checkbox.checked) {
        row.dataset.on = 'true';
        status.textContent = 'Carregando…';
        status.className = 'layer-status';
        try {
            const layer = await loadLayer(name, config);
            layer.setOpacity(opacity.value / 100);
            if (checkbox.checked) map.addLayer(layer);
            status.textContent = '';
        } catch (err) {
            row.dataset.on = 'false';
            status.textContent = 'falhou';
            status.className = 'layer-status is-error';
            status.title = 'Não foi possível carregar esta camada. Tente novamente.';
            checkbox.checked = false;
        }
    } else {
        row.dataset.on = 'false';
        status.textContent = '';
        status.className = 'layer-status';
        const st = layerState[name];
        if (st && st.layer && map.hasLayer(st.layer)) map.removeLayer(st.layer);
    }
}

function buildControls() {
    container.innerHTML = '';
    for (const [name, config] of Object.entries(layersConfig)) {
        const row = document.createElement("div");
        row.className = "layer-row";
        row.dataset.name = name;

        const label = document.createElement("label");
        label.className = "layer-toggle";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.className = "layer-check";
        checkbox.setAttribute("aria-label", `Mostrar ${name}`);
        checkbox.checked = DEFAULT_LAYERS.includes(name);
        row.dataset.on = checkbox.checked ? 'true' : 'false';

        const sym = document.createElement("span");
        sym.className = "layer-symbol";
        sym.innerHTML = symbol(name, config.color);

        const nameEl = document.createElement("span");
        nameEl.className = "layer-name";
        nameEl.textContent = name;

        const kindEl = document.createElement("span");
        kindEl.className = "layer-kind";
        kindEl.textContent = config.kind;

        const status = document.createElement("span");
        status.className = "layer-status";
        status.setAttribute("aria-live", "polite");

        const opacity = document.createElement("input");
        opacity.type = "range";
        opacity.min = "0";
        opacity.max = "100";
        opacity.value = "100";
        opacity.className = "layer-opacity";
        opacity.setAttribute("aria-label", `Opacidade de ${name}`);

        label.appendChild(checkbox);
        label.appendChild(sym);
        label.appendChild(nameEl);
        label.appendChild(kindEl);

        checkbox.addEventListener("change", () => enableLayer(name, config, controls[name]));
        opacity.addEventListener("input", () => {
            const st = layerState[name];
            if (st && st.layer) st.layer.setOpacity(opacity.value / 100);
        });

        row.appendChild(label);
        row.appendChild(status);
        row.appendChild(opacity);
        container.appendChild(row);

        controls[name] = {checkbox, status, opacity, row};
    }

    // camadas ligadas por padrão (carregadas sob demanda)
    for (const name of DEFAULT_LAYERS) {
        if (controls[name]) enableLayer(name, layersConfig[name], controls[name]);
    }
}

buildControls();

// ---------------------------
// CLICK NO MAPA → FICHA DE DADOS
// ---------------------------
function fichaHeader(lat, lon) {
    return `<div class="ficha-eyebrow">Coordenadas</div>` +
        `<p class="ficha-coords">Lat ${lat.toFixed(6)}<br>Lon ${lon.toFixed(6)}</p>`;
}

async function buildInfoPopup(lat, lon) {
    let html = fichaHeader(lat, lon);

    const enabled = Object.entries(layersConfig).filter(([name]) => {
        const st = layerState[name];
        return st && st.layer && map.hasLayer(st.layer);
    });
    if (enabled.length === 0) {
        html += `<p class="ficha-empty">Ative uma camada para inspecionar os dados do ponto.</p>`;
        return html;
    }

    const results = await Promise.all(enabled.map(async ([name, config]) => {
        try {
            const qs = new URLSearchParams({asset_id: config.asset, lat, lon});
            const res = await fetch(`/info?${qs}`);
            const data = await res.json();
            return {name, config, properties: res.ok ? data.properties : null};
        } catch {
            return {name, config, properties: null};
        }
    }));

    let any = false;
    for (const {name, config, properties} of results) {
        if (!properties || Object.keys(properties).length === 0) continue;
        any = true;
        const attrs = Object.entries(properties)
            .slice(0, 5)
            .map(([k, v]) =>
                `<div><dt>${escapeHtml(k)}</dt><dd>${escapeHtml(formatValue(v))}</dd></div>`
            )
            .join('');
        html += `<div class="ficha-entry">` +
            `<h3 class="ficha-layer"><span class="ficha-symbol">${symbol(name, config.color)}</span>${escapeHtml(name)}</h3>` +
            `<dl class="ficha-attrs">${attrs}</dl></div>`;
    }
    if (!any) html += `<p class="ficha-empty">Sem dados nesta área.</p>`;
    return html;
}

let popupBusy = false;
map.on('click', async function (e) {
    if (popupBusy) return;
    popupBusy = true;
    const lat = e.latlng.lat;
    const lon = e.latlng.lng;
    const html = await buildInfoPopup(lat, lon);
    L.popup()
        .setLatLng(e.latlng)
        .setContent(html)
        .openOn(map);
    popupBusy = false;
});
</script>
